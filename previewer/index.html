<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRS019 Previewer — Primary Data Inspection</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: #0b0e13; color: #d6dbe3; }
  #app { display: flex; height: 100%; }
  #panel { width: 300px; flex: none; background: #12161e; border-right: 1px solid #232a36; display: flex; flex-direction: column; }
  #panel header { padding: 10px 12px; border-bottom: 1px solid #232a36; }
  #panel header h1 { font-size: 13px; margin: 0 0 2px; letter-spacing: .3px; }
  #panel header p { margin: 0; font-size: 11px; color: #7d8797; }
  #controls { padding: 8px 12px; border-bottom: 1px solid #232a36; font-size: 12px; }
  #controls label { display: block; margin: 6px 0 2px; color: #9aa5b5; }
  #controls .row { display: flex; align-items: center; gap: 8px; }
  #controls input[type=range] { width: 100%; }
  #controls .val { font-variant-numeric: tabular-nums; color: #cfd6e2; min-width: 42px; text-align: right; }
  #layers { flex: 1; overflow-y: auto; padding: 4px 0 20px; }
  .grp { margin-top: 4px; }
  .grp > .ghead { display: flex; align-items: center; gap: 6px; padding: 5px 12px; background: #161b25; position: sticky; top: 0;
    font-size: 12px; font-weight: 600; cursor: pointer; user-select: none; }
  .grp .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .lyr { display: flex; align-items: center; gap: 7px; padding: 3px 12px 3px 22px; font-size: 12px; }
  .lyr:hover { background: #161b25; }
  .lyr .swatch { width: 11px; height: 11px; border-radius: 2px; flex: none; border: 1px solid #0006; }
  .lyr .nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lyr .ct { color: #6d7684; font-size: 10px; font-variant-numeric: tabular-nums; }
  .code { color: #7079; font-variant-numeric: tabular-nums; min-width: 26px; }
  #stage { flex: 1; position: relative; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud { position: absolute; left: 10px; bottom: 8px; font-size: 11px; color: #7d8797; pointer-events: none;
    background: #0b0e13aa; padding: 4px 8px; border-radius: 4px; }
  #btns { display: flex; gap: 6px; margin-top: 8px; }
  #btns button { flex: 1; background: #1d2430; color: #cfd6e2; border: 1px solid #2c3546; border-radius: 4px; padding: 5px; font-size: 11px; cursor: pointer; }
  #btns button:hover { background: #263042; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #9aa5b5; }
</style>
</head>
<body>
<div id="app">
  <div id="panel">
    <header>
      <h1>GRS019 Previewer</h1>
      <p>Preprocessing primary-data inspection &middot; display-only subsample</p>
    </header>
    <div id="controls">
      <label>Vertical exaggeration <span class="val" id="vex-val">40&times;</span></label>
      <input type="range" id="vex" min="1" max="200" value="40">
      <label>Point size <span class="val" id="ps-val">2.0</span></label>
      <input type="range" id="ps" min="1" max="8" step="0.5" value="2">
      <div id="btns">
        <button id="reset">Reset view</button>
        <button id="allon">All on</button>
        <button id="alloff">All off</button>
      </div>
    </div>
    <div id="layers"></div>
  </div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="hud"></div>
    <div id="loading">Loading data&hellip;</div>
  </div>
</div>
<script>
// ---------- minimal mat4 ----------
function mul(a,b){const o=new Float32Array(16);for(let r=0;r<4;r++)for(let c=0;c<4;c++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s;}return o;}
function perspective(fovy,asp,n,f){const t=1/Math.tan(fovy/2);const o=new Float32Array(16);o[0]=t/asp;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);return o;}
function lookAt(e,c,u){const z=norm(sub(e,c));const x=norm(cross(u,z));const y=cross(z,x);
  return new Float32Array([x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0, -dot(x,e),-dot(y,e),-dot(z,e),1]);}
function sub(a,b){return [a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
function cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function norm(a){const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];}

// ---------- gl setup ----------
const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl',{antialias:true});
const VS=`attribute vec3 aPos; uniform mat4 uMVP; uniform float uVExag; uniform float uPS;
void main(){ vec3 p=vec3(aPos.x,aPos.y,aPos.z*uVExag); gl_Position=uMVP*vec4(p,1.0); gl_PointSize=uPS; }`;
const FS=`precision mediump float; uniform vec3 uColor;
void main(){ vec2 d=gl_PointCoord-vec2(0.5); if(dot(d,d)>0.25) discard; gl_FragColor=vec4(uColor,1.0); }`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o;}
const prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(prog);gl.useProgram(prog);
const aPos=gl.getAttribLocation(prog,'aPos');
const uMVP=gl.getUniformLocation(prog,'uMVP'),uVExag=gl.getUniformLocation(prog,'uVExag'),uPS=gl.getUniformLocation(prog,'uPS'),uColor=gl.getUniformLocation(prog,'uColor');
gl.enable(gl.DEPTH_TEST);

function hexRGB(h){return [parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255];}

// ---------- camera (z-up orbit) ----------
let yaw=-0.9, pitch=0.5, dist=1, target=[0,0,0];
function eye(){return [target[0]+dist*Math.cos(pitch)*Math.cos(yaw), target[1]+dist*Math.cos(pitch)*Math.sin(yaw), target[2]+dist*Math.sin(pitch)];}
function resize(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=canvas.clientWidth*dpr;canvas.height=canvas.clientHeight*dpr;gl.viewport(0,0,canvas.width,canvas.height);}
window.addEventListener('resize',resize);

let dragging=0,lx=0,ly=0;
canvas.addEventListener('mousedown',e=>{dragging=e.button===2?2:1;lx=e.clientX;ly=e.clientY;});
window.addEventListener('mouseup',()=>dragging=0);
window.addEventListener('mousemove',e=>{if(!dragging)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;
  if(dragging===1){yaw-=dx*0.005;pitch=Math.max(-1.5,Math.min(1.5,pitch+dy*0.005));}
  else{const ev=eye();const fwd=norm(sub(target,ev));const right=norm(cross(fwd,[0,0,1]));const up=cross(right,fwd);
    const k=dist*0.0015;target[0]-=(right[0]*dx-up[0]*dy)*k;target[1]-=(right[1]*dx-up[1]*dy)*k;target[2]-=(right[2]*dx-up[2]*dy)*k;}});
canvas.addEventListener('wheel',e=>{e.preventDefault();dist*=Math.exp(e.deltaY*0.001);},{passive:false});
canvas.addEventListener('contextmenu',e=>e.preventDefault());

// ---------- state ----------
let layers=[], vExag=40, ps=2, home=null;
const vexEl=document.getElementById('vex'),psEl=document.getElementById('ps');
vexEl.oninput=()=>{vExag=+vexEl.value;document.getElementById('vex-val').textContent=vExag+'×';};
psEl.oninput=()=>{ps=+psEl.value;document.getElementById('ps-val').textContent=ps.toFixed(1);};
document.getElementById('reset').onclick=()=>{if(home){yaw=home.yaw;pitch=home.pitch;dist=home.dist;target=home.target.slice();}};
document.getElementById('allon').onclick=()=>{layers.forEach(l=>{l.on=true;});syncChecks();};
document.getElementById('alloff').onclick=()=>{layers.forEach(l=>{l.on=false;});syncChecks();};
function syncChecks(){document.querySelectorAll('input.lyrchk').forEach(cb=>{cb.checked=layers[+cb.dataset.i].on;});}

// ---------- load ----------
async function load(){
  const pm=await (await fetch('preview_manifest.json')).json();
  const b=pm.localBounds;
  const ext=Math.max(b.x[1]-b.x[0], b.y[1]-b.y[0]);
  dist=ext*1.1; target=[0,0,0];
  home={yaw,pitch,dist,target:[0,0,0]};
  // build panel grouped by age
  const panel=document.getElementById('layers');
  const byAge={}; pm.layers.forEach((L,i)=>{L._i=i;(byAge[L.age]||(byAge[L.age]=[])).push(L);});
  for(const age of pm.ageOrder){ if(!byAge[age])continue;
    const g=document.createElement('div');g.className='grp';
    const head=document.createElement('div');head.className='ghead';
    head.innerHTML=`<span class="swatch" style="background:${byAge[age][0].color}"></span>${age} <span class="code" style="margin-left:auto">${byAge[age].length}</span>`;
    g.appendChild(head);
    head.onclick=()=>{const any=byAge[age].some(L=>!layers[L._i].on);byAge[age].forEach(L=>layers[L._i].on=any);syncChecks();};
    byAge[age].forEach(L=>{
      const row=document.createElement('div');row.className='lyr';
      row.innerHTML=`<input type="checkbox" class="lyrchk" data-i="${L._i}" checked>
        <span class="swatch" style="background:${L.color}"></span>
        <span class="code">${L.code}</span><span class="nm" title="${L.name}">${L.name}</span>
        <span class="ct">${L.previewCount.toLocaleString()}</span>`;
      g.appendChild(row);
      row.querySelector('input').onchange=e=>{layers[L._i].on=e.target.checked;};
    });
    panel.appendChild(g);
  }
  // fetch bins -> VBOs
  for(const L of pm.layers){
    const buf=await (await fetch(L.file)).arrayBuffer();
    const arr=new Float32Array(buf);
    const vbo=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vbo);gl.bufferData(gl.ARRAY_BUFFER,arr,gl.STATIC_DRAW);
    layers[L._i]={on:true,vbo,n:arr.length/3,color:hexRGB(L.color),name:L.name};
  }
  document.getElementById('loading').remove();
  resize();requestAnimationFrame(frame);
}

function frame(){
  const asp=canvas.width/canvas.height;
  const proj=perspective(50*Math.PI/180,asp,dist*0.001,dist*10);
  const view=lookAt(eye(),target,[0,0,1]);
  const mvp=mul(proj,view);
  gl.clearColor(0.043,0.055,0.075,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.uniformMatrix4fv(uMVP,false,mvp);gl.uniform1f(uVExag,vExag);gl.uniform1f(uPS,ps);
  let vis=0,pts=0;
  for(const L of layers){ if(!L||!L.on)continue;
    gl.bindBuffer(gl.ARRAY_BUFFER,L.vbo);gl.enableVertexAttribArray(aPos);gl.vertexAttribPointer(aPos,3,gl.FLOAT,false,0,0);
    gl.uniform3fv(uColor,L.color);gl.drawArrays(gl.POINTS,0,L.n);vis++;pts+=L.n;}
  document.getElementById('hud').textContent=`Layers ${vis} / points ${pts.toLocaleString()}  ·  left-drag rotate, right-drag pan, wheel zoom`;
  requestAnimationFrame(frame);
}
load().catch(e=>{document.getElementById('loading').textContent='Load failed: '+e;});
</script>
</body>
</html>
