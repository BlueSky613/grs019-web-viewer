<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- polished-chrome vertical reflection band (silver) -->
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#ffffff"/>
      <stop offset="0.16" stop-color="#dfe3e8"/>
      <stop offset="0.46" stop-color="#8b9198"/>
      <stop offset="0.50" stop-color="#4d525a"/>
      <stop offset="0.54" stop-color="#868c94"/>
      <stop offset="0.82" stop-color="#eef2f6"/>
      <stop offset="1"    stop-color="#aab2bb"/>
    </linearGradient>
    <!-- black tile with a little depth -->
    <radialGradient id="tile" cx="0.5" cy="0.32" r="0.9">
      <stop offset="0"   stop-color="#2b2f34"/>
      <stop offset="0.55" stop-color="#111316"/>
      <stop offset="1"   stop-color="#000000"/>
    </radialGradient>
    <!-- 3D drop shadow for the S -->
    <filter id="depth" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.1" stdDeviation="1.1" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- glossy black rounded tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#tile)" stroke="#000000" stroke-width="1"/>
  <!-- top sheen on the tile -->
  <path d="M8 6 H56 a8 8 0 0 1 8 8 v9 c-14 8 -42 8 -56 0 V14 a8 8 0 0 1 8-8 z" fill="#ffffff" opacity="0.10"/>

  <!-- depth shadow copy of the S -->
  <text x="32" y="46.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="48" font-weight="700" fill="#000000" opacity="0.55">S</text>
  <!-- chrome S -->
  <text x="32" y="45.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="48" font-weight="700" fill="url(#chrome)" stroke="#23262b" stroke-width="0.6"
        filter="url(#depth)">S</text>
  <!-- specular highlight across the upper curve of the S -->
  <text x="32" y="45.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="48" font-weight="700" fill="#ffffff" opacity="0.35"
        clip-path="inset(0 0 55% 0)">S</text>
</svg>
